const DATA={"chapters": [{"title": "布比中东业务经营方案与精细测算", "body": "复盘修订版 v2.1　2026年10月20日\n适用范围　阿联酋与沙特首年进入计划及后三年发展路径\n提交对象　布比管理层与国际业务负责人\n建议将中东业务从“小规模试点计划”提升为“企业平台与产业连接双线经营”。首年以332万美元企业业务为核心任务，另以144万美元产业平台合同为附条件增量，构成约476万美元资源到位目标；786万美元仅为突破情景，不作为无条件考核。\n这一建议不是从宏观市场直接乘一个份额得出。市场空间只证明可以研究进入；项目数量、单位价格、销售节奏、总部容量和现金承受力共同决定能做多大。\n基准条件下，净签约476万美元、确认收入410万美元、回款375.5万美元、现金支出335.9万美元、税前区域经营贡献69.1万美元。年内峰值缺口81.6万美元，加三个月固定费用储备后需108.2万美元周转额度；回款再延迟两个月时需188.3万美元。\n关键约束：模型需要138个有效工程人月，实施峰值36名名义工程FTE，并非36名全年新增员工。总部能否调配、伙伴能否承担和产品能否复用，决定目标是否应下调。\n事实、推断与假设：R编号为公开原始来源；L编号为用户材料；H为经营假设。所有销售及预算结果均为条件测算，不是已有订单、审计数据或统计置信区间。\nY1为正式启动后的12个月，M1至M12不硬套公历；Y2至Y4为随后年度。金额除另注外均为万美元，人民币仅按7.2预算汇率演示。"}, {"title": "复盘结论与本次修正", "body": "| 问题 | 证据与影响 | v2.1处理 |\n| 目标依据仍有主观参数 | 476万来自订单组合；380万漏斗值也依赖未经实测概率 | 定位为挑战任务；列出97家企业、20家运营方的反推条件 |\n| 资金拨付节奏不匹配 | D180前80万，小于M6缺口81.6万 | 改50+50+20，第三批最迟M5末到账 |\n| 附加占用缺依据 | 120万减108.2万只有11.8万，未证实能覆盖税费和保函 | 独立列税费、保证金压力输入，基准示例总量152.2万 |\n| 后续年公式传递不完整 | 报价系数未作用于全部新增收入；续费按年提前折损 | 新增周年服务队列；降价、成本、保留率等联动检查 |\n| 年度现金精度过高 | 签约×90%未处理开票和支持服务起始月份 | 撤下Y2–4现金数字，保留未月化提示 |\n| 核验公式未执行 | 合同计划核验为文本；数量超过模板会被截断 | 修正公式，新增数量、付款、完整性和逐月桥接检查 |\n本次没有用更高数字作为优化标准。首年基准410万收入、69.1万经营贡献暂不改变，是因为修正项未改动其合同和成本输入；不代表这些输入已经由实际业务证实。新版可用于内部方案与条件预算讨论，尚不能作为对外业绩承诺或已批准投资依据。"}, {"title": "01 原预算依据及必须修正的问题", "body": "原180万美元来自4个验证×6万、2个生产实施×38万、2份支持×10万、1个产业连接×60万。原文已标明这些是规划假设，但没有证明数量、价格和时间为何适合布比。[L03]\n原160万美元现金支出由固定费用102万、直接成本现金支付58万组成。收入120万、直接成本66万、应收18万、预收24万和应付8万在算术上能够衔接；它的问题主要是业务依据和时间排程不足，而非加减错误。\n| 旧判断 | 复核结论 | 本次修订 |\n| 首年仅两个生产客户 | 对应试水型资源配置；不是市场容量结论 | 建立企业与产业两条收入路径 |\n| 总部约两名工程资源 | 全年名义24人月，75%利用率仅18有效人月 | 逐合同核算工程人月与峰值并发 |\n| 直接成本按收入55% | 缺项目工时及外部费用明细 | 按工程、云、分包、安全、差旅和佣金计算 |\n| 90万周转授权 | 没有月度峰值证据 | 按累计现金最低点加储备反推 |\n| Y4收入800万 | 缺新增、续费、流失和交付推导 | 将企业新增、产业新增和支持队列分开 |\n为什么原目标偏低：原模型先限定了很小的进入团队和客户数量，又把产业平台大单作为可放弃选项，因此得到的本来就是验证市场的规模。它没有证明“布比最多只能做到180万”，也没有证明“大市场下首年必然应做1000万”。\n本次不沿用原材料中未经核验的52%净利率、融资断档即资金紧张、没有境外记录即没有海外主体等推断。资料缺失不能替代事实。[L01、L02]"}, {"title": "02 布比体量如何约束目标", "body": "| 维度 | 可以使用的证据 | 能得出什么 |\n| 收入量级 | 用户材料约9600万至11800万元人民币，年份及合并口径待核 | 只能做规模敏感性，不能当2026审计营收 |\n| 人员量级 | 材料同时列129名员工、59名参保人员 | 统计口径不同，不等于可调配工程师 |\n| 业务能力 | 官网国际方向包括产业公链建设、联合运营、跨境可信业务 | 可讨论平台与运营类合同，不证明中东已有客户 |\n| 国际参照 | MYEG/Zetrix披露Web3服务、节点和代币等收入来源 | 有多层收费模式，但不能套其总利润率 |\n以7.2人民币/美元的预算汇率演示，旧版120万美元收入约占该公司收入量级的7.3%至9.0%；新版410万美元约占25.0%至30.8%。这属于具有战略重要性的业务建设，而非增加一名销售便能自然达成的增量。\n新版476万美元签约折合约3427万元人民币，但签约与母公司营收不是同一会计口径，不能将两者比例称为收入贡献率。\n基准峰值36名工程FTE，分别相当于129人参考值的27.9%和59人参考值的61.0%。后者只作为极端容量警示，不能解释为公司实际工程师占比。总部若不能提供资源池，必须提前签订有人员排期的交付伙伴合同，或把验收及收入顺延。\n建议管理层选择的是“愿不愿意把中东建设成占公司现有收入量级约四分之一的业务”，而非仅讨论国家经理一个人的销售指标。[L01、L02、R09、R10]"}, {"title": "03 中东市场数据与口径边界", "body": "| 来源 | 公开数值 | 本方案用途 |\n| MarketsandMarkets R01 | UAE 2025年8.186亿美元，2030年110.395亿美元 | 商业研究预期，仅作宽口径参照 |\n| IMARC R02 | 沙特2025年3.807亿美元，2034年380.649亿美元 | 平台及服务类别，未取得完整样本方法 |\n| P&S R03 | 沙特2025年112亿美元 | 比R02高约29倍；不平均、不作为预算基数 |\n| Ken Research R04 | MEA 2024年38.5亿美元 | 包括非洲，不能视作两国市场 |\n| Chainalysis R05 | MENA一年链上接收3387亿美元 | 交易流量，不能当作技术服务收入 |\n上述市场研究均非官方统计。不同出版商对链基础设施、应用、支付、服务和数字资产的覆盖可能不同。公开摘要无法完成严格统一口径，所以“UAE+沙特约11.99亿美元”仅为量级拼接，不是可审计的同口径市场总额。\n保留出版商原始预测：UAE CAGR 68.3%、沙特64.81%。本方案不采用这些高增速推动公司收入；市场校验另用25%年增长的规划情景，并测试零增长和40%增长。增长率本身属于H，不冒充行业一致预期。\nDLD于2026年2月公布地产代币化二期，说明当地存在真实应用进程；但代币数量和地产资产金额不等于布比可取得的合同，也不证明布比有项目参与权。[R11]\n复盘补充：R01直链本次打开重定向至出版商主页，搜索缓存仍展示818.6百万美元原值。此项仅保留为可追溯历史摘要，不能称为已取得完整报告；R02公开摘要复核相符。宏观SAM不参与合同数量和收入公式。"}, {"title": "04 从宽市场到可服务机会", "body": "范围限定：布比可销售的软件许可、实施、系统连接、可信凭证、产业平台建设与支持服务。排除币价收益、交易本金、地产资产价值、融资额、代收税款，以及不属于布比的伙伴收入。\n以2025两国宽口径11.993亿美元、25%规划增速为例，2026参考为14.991亿美元。可服务机会＝宽口径×相关企业场景比例×外购可服务比例×实际准入比例。后面三个参数全部是待校准假设。\n| 折减情景 | 场景×外购×准入 | 2026机会区间 |\n| 低 | 10%×30%×30% | 约1349万美元 |\n| 中 | 20%×50%×50% | 约7496万美元 |\n| 高 | 30%×60%×70% | 约1.889亿美元 |\n这些区间跨度大，正说明公开资料不足以“精准测出市场份额”。基准410万美元收入相当于上述低、中、高机会的30.4%、5.5%、2.2%；在低空间情景中目标明显偏激进，不能只选中值为目标背书。\n交叉检查使用账户规划池：UAE企业100家×15%采购概率×67万美元，沙特120家×12%×67万，产业运营方30家×12%×144万，合计2488.2万美元年度可争取合同池。250家只是待建立的命名账户池，非已统计客户数；三类账户按预算主体去重。\n476万美元相当于规划池19.1%。新进入者需要获得近五分之一的有效池，竞争压力并不低。宏观市场足够大是必要条件，进入渠道和可赢账户才是成交条件。\n若宽市场零增长，中值机会约5997万美元；40%增长时约8395万美元。宏观增速变化对目标影响小于单个产业项目成败、验收延误和付款延迟。"}, {"title": "05 产品组合与收费边界", "body": "| 产品 | 首年净合同价 | 范围及买方 |\n| P 收费验证 | 8万美元一次性 | 6至8周、1个接口；业务部门与IT共同验收 |\n| E 企业生产平台 | 55万实施+12万年度支持 | 4个月，2至3个接口；集团采购、贸易或供应链部门 |\n| N 产业连接平台 | 120万实施+24万年度支持 | 7个月，4至6个接口；产业运营方或集成商 |\n产业连接平台是有明确工作范围的软件及连接项目，不等同国家级区块链超级节点，更不包含未经授权的全国独家运营权。国家级框架、大规模RWA发行和稳定币业务保留为战略机会，不进入本次收入基本盘。\n验证费与生产费分属不同交付范围，基准不冲抵。如果客户要求验证费抵扣，生产净额同步减少，不能两次计入。4个生产客户来自8个验证客户，故企业独立客户为8家，而不是12家；加独立产业运营方后合计9家签约客户。\n平台支持包含软件维护、容量内云与运行支持、约定工作时间的服务，不无限承担人工运营或全天候金融核心系统SLA。额外接口、硬件、金融许可、驻场人力和第三方许可用单独工作包报价。\n价值门槛：企业客户前期支出63万美元（8万验证+55万实施），年支持12万。若要求18个月简单回收期，年度可量化收益需至少54万美元，即63÷1.5+12。客户确认的节省工时、异常损失及周转收益不达此值，应缩小范围或降成本，不能只引用区块链行业增长。"}, {"title": "06 单价和毛利怎样推导", "body": "| 单项目成本 万美元 | 验证P | 企业E | 产业N |\n| 工程人月 | 3 | 18 | 42 |\n| 工程成本 每人月0.8 | 2.4 | 14.4 | 33.6 |\n| 本地分包 | 0.5 | 5.0 | 12.0 |\n| 云及资源 | 0.3 | 2.0 | 6.0 |\n| 安全测试 | 0.3 | 2.0 | 5.0 |\n| 交付差旅 | 0.2 | 2.0 | 3.0 |\n| 实施直接成本 | 3.7 | 25.4 | 59.6 |\n| 12个月支持成本 | 0 | 3.6 | 7.2 |\n| 按净合同5%销售佣金 | 0.4 | 3.35 | 7.2 |\n| 含支持总直接成本 | 4.1 | 32.35 | 74.0 |\n| 全合同毛利率 | 48.8% | 51.7% | 48.6% |\n以上工时及采购价均为H01，不是公开成交案例的均价。每人月8000美元是总部交付成本与分摊预算，不等于个人月薪。架构师和交付经理列在固定费用，项目工程人月不含其重复工时。\n40%毛利底价＝不含佣金直接成本÷（1−40%−5%佣金）。三类合同底价约6.73万、52.73万、121.45万美元。当前报价相对底价分别有约18.9%、27.1%、18.6%空间，但不能将全部空间当作可折扣利润。\n当前报价允许的最大折扣（折后仍保40%毛利）分别约15.9%、21.3%、15.7%，不能将相对底价的溢价率误当折扣率。前三份正式报价须带成本表和客户收益表。10%以上折扣、额外驻场或不限量SLA，应重新核算；不能销售签了合同以后再要求交付团队吸收亏损。\n人月单价的分母必须一致：本模型8000美元按有效交付人月计，已假设包含空闲与管理分摊。若实际拿到的是8000美元/名义在岗月，则75%利用率下应改为10667美元/有效人月，不能仍填8000。按基准138有效人月，差额36.8万美元，经营贡献会由69.1万降至约32.3万，其他条件不变。"}, {"title": "07 从销售漏斗反推目标", "body": "企业线：80个主动开发账户×55%合格需求×60%预算方案×35%验证赢单×90%年内签约＝8.316个验证期望数。再×50%生产转换×80%年内采购＝3.3264个生产期望数。\n企业路径风险调整合同额＝8.316×8+3.3264×67＝289.4万美元。产业线另从12个运营方账户×50%预算资格×50%正式方案×35%中标×60%年内签约＝0.63个项目，金额90.7万美元。两线合计约380.1万美元。\n所有转化率均为经营假设，没有本地成交样本，不能称为统计预测。476万美元数量目标比风险调整规划值高约25.2%，是需要执行改善才能达到的挑战目标。\n| 目标层 | 净签约 | 成立条件 |\n| 企业核心任务 | 332万美元 | 8验证+4生产；即使产业项目未中也可独立经营 |\n| 资源到位总目标 | 476万美元 | 企业核心+1个144万产业合同；M6完成产业签约 |\n| 突破目标 | 786万美元 | 12验证+6生产+2产业；第二产业大部分收入跨年 |\n| 谨慎进入 | 166万美元 | 4验证+2生产，成交统一晚2个月，60天回款 |\n不以MOU、政府关系、候选人历史工程收入或集团总交易额替代订单。Commit必须逐笔有预算、采购路径、决策日期和关键条款证据；没有这些数据时，当前可出的是目标与资源模型，不能制造“已验证预测”。\n核心企业任务是资源与动作承诺，不是无风险保底。若仅具备原两名总部工程资源且无交付伙伴，任何一档目标都需要重排范围与工期。\n按当前转化率，4个生产合同的期望需要96.2个主动企业账户，执行取整至少97家；1个产业合同的期望需要19.05家运营方，至少20家。若仍只开发80家企业，生产转化率须从50%提升至60.1%。这只是数量反推，不能把97/20账户当作已有商机，也不能据此保证成交。"}, {"title": "08 首年三档测算与旧版对比", "body": "| 指标 万美元 | 旧版 | 谨慎进入 | 资源到位 | 突破 |\n| 净签约 | 180.0 | 166.0 | 476.0 | 786.0 |\n| 确认收入 | 120.0 | 143.0 | 410.0 | 489.0 |\n| 实际回款 | 126.0 | 87.0 | 375.5 | 479.3 |\n| 毛利 | 54.0 | 68.8 | 193.6 | 220.6 |\n| 固定费用 | 102.0 | 102.1 | 124.5 | 159.4 |\n| 经营贡献 | -48.0 | -33.3 | 69.1 | 61.2 |\n| 现金支出 | 160.0 | 172.4 | 335.9 | 467.4 |\n| 全年净现金流 | -34.0 | -85.4 | 39.6 | 11.9 |\n| 周转额度含储备 | 90.0未月测 | 118.5 | 108.2 | 153.5 |\n| 实施峰值FTE | 未测 | 14.0 | 36.0 | 52.0 |\n旧版数字来自L03；新版来自同一合同和成本模型的三个情景。新版成本率不是预先指定，收入与工程成本按合同节点计算后才得到毛利率。\n突破情景的签约明显高于资源到位情景，但确认收入仅489万美元、经营贡献约61.2万美元：新增项目晚签，工程成本先投入，收入跨年。这正是签约增长不必然带来当年利润增长的原因。\n谨慎情景收入143万美元、经营贡献约负33.3万美元，现金净流出85.4万美元。缩小业务不一定降低周转额度，因为回款更慢且固定费用仍需维持。\n净签约476万美元的合理表达是“约450万至500万美元资源到位目标”，而不是承诺精确到个位万美元。表内保留小数是为了复核公式，不表示预测精度。"}, {"title": "09 每个订单何时形成收入", "body": "| 合同槽位 | 签约月 | 验收月 | 支持开始 | 净签约 万美元 |\n| P01至P08 | M3至M10 每月1个 | M4至M11 | 无 | 8×8＝64 |\n| E01 | M6 | M9 | M10 | 67 |\n| E02 | M7 | M10 | M11 | 67 |\n| E03 | M8 | M11 | M12 | 67 |\n| E04 | M9 | M12 | M13 | 67 |\n| N01 | M6 | M12 | M13 | 144 |\nP/E/N编号是模型槽位，不是真实客户或商机名称。M6签产业合同要求M1即进入运营方接洽及采购准备；若从零开发，应另外测试7至12个月销售周期，并通过签约延迟参数检验，而不能假装M6必成。\n收入计划：实施合同在约定验收时点确认；支持从验收次月起分12个月确认。这里采用便于经营测算的时点模型，实际会计政策需按控制权转移、履约义务及合同条款确定。不能为了年度指标把未验收实施收入提前确认。\n基准收入桥：验证64万+企业实施220万+产业实施120万+当年支持6万＝410万美元。已签年度支持总额72万，其中66万留待以后服务期确认。\n年末已开始服务ARR为36万美元；已签支持年化总额72万美元。两者都不是当年支持收入6万美元，不得混用。最后两个平台于M12验收、M13服务启动，所以年末未计生效ARR。"}, {"title": "10 首年逐月经营现金表", "body": "| 月份 | 签约 | 收入 | 回款 | 支出 | 累计现金 |\n| M1 | 0.0 | 0.0 | 0.0 | 11.3 | -11.3 |\n| M2 | 0.0 | 0.0 | 0.0 | 15.0 | -26.3 |\n| M3 | 8.0 | 0.0 | 0.0 | 12.9 | -39.2 |\n| M4 | 8.0 | 8.0 | 2.4 | 16.0 | -52.8 |\n| M5 | 8.0 | 8.0 | 8.0 | 15.0 | -59.8 |\n| M6 | 219.0 | 8.0 | 8.0 | 29.8 | -81.6 |\n| M7 | 75.0 | 8.0 | 60.5 | 36.8 | -57.9 |\n| M8 | 75.0 | 8.0 | 24.5 | 41.4 | -74.8 |\n| M9 | 75.0 | 63.0 | 46.5 | 48.8 | -77.1 |\n| M10 | 8.0 | 64.0 | 111.0 | 46.0 | -12.1 |\n| M11 | 0.0 | 65.0 | 58.5 | 35.5 | 10.9 |\n| M12 | 0.0 | 178.0 | 56.1 | 27.4 | 39.6 |\n支付结构假设：实施30%签约开票、40%工期中期开票、30%验收开票；年度支持在服务开始时开票。基准每笔开票次月到账，谨慎情景隔两个月到账。\n直接交付支出在实施期均匀支付；支持成本随服务月发生；销售佣金按签约计提、随客户实际回款支付。未使用供应商赊账作为默认融资来源。\nM6累计缺口达到81.6万美元，年底回流39.6万美元。即使年度净现金为正，进入阶段仍必须获得资金。季度现金复核不能替代月度排程。\n本表不包含可抵扣增值税、税款缴付、银行保函保证金、资本开支及融资利息。下一页给出资金附加量和压力准备，不能把335.9万宣传为法律意义的绝对支出上限。"}, {"title": "11 回款桥接和资金授权", "body": "| 基准年末项目 | 万美元 | 计算含义 |\n| 累计开票 | 440.0 | 实施404万+已开始服务开票36万 |\n| 已收现金 | 375.5 | 按每笔账期计算 |\n| 应收账款 | 64.5 | 开票减实收 |\n| 净合同负债 | 30.0 | 开票减收入；实际合同资产负债不得跨合同抵销 |\n| 佣金应付 | 5.025 | 签约计提23.8万减已付18.775万 |\n| 履约成本余额 | 0.0 | 基准所有Y1实施在年内验收 |\n| 利润转现金 | 39.6 | 69.1−64.5+30+5.025−0 |\n基础周转需要81.6万，另留26.6万三个月固定费用，合计108.2万。120万美元只可作为未加入税款、保函和设备等附加项的基础额度，11.8万余量没有证据证明足够覆盖这些项。须逐项取数后确定总额度；额度不等于损益费用。\n付款延迟两个月的模型需要188.3万，建议设置190万美元压力额度；签约晚三个月、回款再晚两个月并叠加直接成本上涨20%，资金需求约225.6万，若仍要保持原组织，则需约230万美元可用额度。\n上述额度不替代税务预算。尚未确定实体、税务居民及服务合同结构，所得税、预提税、增值税和总部转移定价不能确定为一个“精确税率”。以合同价5%不可回收税费作商业压力假设，会额外消耗23.8万美元并减少同额贡献；这不是当地法定税率。\n原40+40+40拨款方案若第三批等到D180后到账，M6前仅80万，低于81.6万模型缺口。改为M1准备50万、最迟M3末再到50万、最迟M5末再到20万。以审批和到账所需提前期安排，未达条件则先减少未承诺支出、重排签约及交付，不能一边停拨一边保留原项目支出。\n附加资金示例：不可回收税费按签约额5%压力参数计23.8万；假设半数实施合同需10%现金保证金，冻结额为404×50%×10%=20.2万。两项合计44万，基准基础108.2万加后为152.2万，可按160万讨论额度。回款慢两个月再叠加这44万则约232.3万，可按240万讨论。全部是待报价、待税务确认的压力参数；冻结保证金不是费用，未计入经营贡献。"}, {"title": "12 岗位预算与费用依据", "body": "| 岗位 | 固定月薪假设 | 在岗月份 | 计价方式 |\n| 国家经理 | USD 20,000全成本 | M1至M12 | 24万美元，已包含派驻预算 |\n| UAE商务 | AED 27,500 | M2至M12 | ×1.05更新×1.18雇主负担 |\n| 沙特商务 | SAR 30,000 | M3至M12 | ×1.05×1.20 |\n| 解决方案架构师 | AED 42,500 | M2至M12 | Hays中值×1.05×1.18 |\n| 交付经理 | AED 35,000 | M4至M12 | ×1.05×1.18 |\n| 运营行政 | AED 15,000，0.5FTE | M1至M12 | ×1.05×1.18 |\n岗位合计73.72万美元。Hays 2025版PDF第72页的架构师固定月薪区间为AED35,000至50,000，中值42,500，数据时点Q4 2024。该薪资已是固定月薪套餐，不能再次叠加同类住房津贴。5%更新因子和雇主负担系数都是本模型假设。[R06至R08]\n非人力固定费用50.8万美元：两国设立及初始法律10万；持续会计法律保险8万；办公工具7.2万；客户差旅活动9.6万；非项目本地化和售前适配12万；招聘培训4万。设立费用分M1至M2，适配分M1至M6，培训分M2至M4，其余按月。\n固定费用合计124.52万美元，比旧版102万增加22.52万。谨慎、突破情景分别按0.82和1.28组织系数测算，实际执行时必须转为岗位增减与到岗时间，不可把系数当作自动压薪或同时分身。\n风险储备不预先列损益费用。董事会保留现金额度，发生实际支出后再进入对应科目，避免储备和实际项目成本重复计算。"}, {"title": "13 交付容量是更高目标的硬条件", "body": "| 月份 | 有效工程人月 | 名义FTE 75%利用率 |\n| M1 | 0.0 | 0.0 |\n| M2 | 0.0 | 0.0 |\n| M3 | 1.5 | 2.0 |\n| M4 | 3.0 | 4.0 |\n| M5 | 3.0 | 4.0 |\n| M6 | 13.5 | 18.0 |\n| M7 | 18.0 | 24.0 |\n| M8 | 22.5 | 30.0 |\n| M9 | 27.0 | 36.0 |\n| M10 | 22.5 | 30.0 |\n| M11 | 16.5 | 22.0 |\n| M12 | 10.5 | 14.0 |\n有效人月＝同月每个实施项目的总工程人月÷工期；名义FTE＝有效人月÷75%。这里的资源可以来自总部、正式外包或已签交付伙伴，但必须有可核验排期。外部采购成本超出8000美元/人月时应上调成本参数。\n基准全年138个有效人月，平均名义15.3人，实施峰值36人。不能用全年平均人数说明高峰有足够容量。峰值来自4个企业平台与产业平台、验证项目同时进行。\n总部仅两名工程师时，全年有效容量约18人月，连一个18人月企业实施之外都无余量承担验证。原组织与原收入组合因此缺乏容量说明。新版的总部10至15名骨干加弹性交付伙伴只是组织备选，并没有证据证明布比能调配这些人，而非假装本地5.5人能全部交付。\n若最多只能调配18名工程FTE，必须把部分企业实施错峰或拆分范围；不能保留M12全部验收和410万收入不变。交付负责人在报价前签署排期，销售不得超容量承诺。\n36人只统计实施工程峰值，不含本地固定团队，也未将支持维护、售前和质量管理转为人数。支持费用已在成本列，但岗位工时没有实证；不能将36人当成全部业务团队规模。每月资源卡应分别列实施、支持、售前、本地固定岗位，避免重复或漏记。"}, {"title": "14 敏感性和盈利边界", "body": "| 变化 | 收入 | 经营贡献 | 周转含储备 |\n| 基准 | 410.0 | 69.1 | 108.2 |\n| 签约整体延后3个月 | 103.0 | -92.5 | 134.9 |\n| 回款再延后2个月 | 410.0 | 69.1 | 188.3 |\n| 未赢产业平台 | 290.0 | 15.9 | 110.1 |\n| 报价下降15% | 348.5 | 11.1 | 125.1 |\n| 直接成本上升20% | 410.0 | 30.6 | 128.0 |\n| 延迟及成本双压 | 103.0 | -102.0 | 225.6 |\n最危险的不是市场增速低几个百分点，而是大项目验收跨年。签约整体晚三个月后，净签约仍可能达到468万，但当年收入降至103万，经营贡献转为负92.5万。仍用高签约宣布年度成功，会掩盖兑现与资金风险。\n报价下降15%时，经营贡献仅约11.1万；直接成本上涨20%时约30.6万。两项同时发生时应另跑组合压力，不能简单认为47.2%毛利有足够缓冲。\n按当前项目结构的47.2%毛利近似，覆盖124.5万固定费用需要约263.7万美元收入。这个盈亏平衡点只在项目结构、收入节点和直接成本不变时成立；不能作为所有组合通用的门槛。\n政府或大型集团单项目的采购延误可能同时影响多个工作包，订单并非独立事件。不使用正态分布或虚构历史波动给出“95%置信区间”；本报告的区间是情景边界。"}, {"title": "15 两国业务分工与商业路径", "body": "阿联酋优先企业供应链、贸易凭证与集团采购，承担快速形成可展示样板、对接跨境企业和培育资产服务生态的任务。沙特同时开发产业运营方和大型集团，但采购资格、数据要求与本地服务能力必须落实。\n经营分配假设：8个验证两国各4个；4个企业生产两国各2个；产业平台优先沙特运营方。由此UAE签约166万，沙特310万。归属只是计划，不是市场份额结论；若产业项目转移国家，法务费用、人员与付款条件应同步重排。\n产业线从第一月开发，不能在企业试点全部结束后才开始。首轮应锁定有真实业务流和年度运营预算的集成商、产业园或集团运营方。平台交付必须包含接口授权、运营责任、最低服务付费和可移交数据，不只出售一个“节点名称”。\n银行、金融科技、地产代币化和持牌结算接口可以培育，但不能把资产本金或支付流量按不明费率变成布比收入。若商业模式改为按笔核验收费，应单列活跃企业数、每企业月交易数、布比净费率、免费额度和上游成本。\n渠道可以降低获客难度，不能同时按总承包价确认收入又额外扣全部渠道分成而不判断主代理关系。本模型价格指布比净合同额，另计5%销售佣金；若集成商拿走20%转售毛利，应先将布比报价净额调整后重算。已包含的支持成本不代表支持人力已经安排，实施容量之外须另外落实服务团队。"}, {"title": "16 账户开发和季度里程碑", "body": "| 时间 | 企业线 | 产业线与预算动作 |\n| M1至M3 | 建立80家主动账户池，20次访谈，至少8家确认预算路线 | 12家运营方清单，至少3家确认运营模式；首批50万额度 |\n| M4至M6 | 累计4个验证签约，首个生产合同，报价成本完整 | 目标M6产业合同，锁定高峰交付；按门槛补款 |\n| M7至M9 | 再签3个企业生产，第二次部署复用 | 产业平台进入联调，实测资源并发与付款速度 |\n| M10至M12 | 累计8验证、4企业生产验收，开始支持 | 产业平台验收，完整现金与收入对账 |\n企业80家主动账户并非同时深耕。按季度选择20家重点账户；其他账户保持培育。250家规划池用于长期覆盖，首年80家为销售工作量。每家至少记录法人、集团关系、预算主体、现有系统、预算年度、采购路径及业务负责人，防止集团子公司重复计数。\nD90：完成可售产品与权限核查、核心岗位到岗、至少2份有预算依据的收费方案、3个产业运营方正式工作会议。达不到时暂停扩编和大会费用，保留必要交付能力。\nD180：基准累计签约243万美元包含产业144万、企业67万和4验证32万。若没有产业合同，则不得继续用476万作为Commit；切换332万企业路径，并依据已签项目保留人员。\n每月滚动13周现金表。客户逾期超过30天、单项目未收款暴露超过经批准额度、有效交付工时超过可用容量时，先重排新项目再谈新增签约。所有停止或延后遵守合同，不能擅自违约停工。\n目标升级条件：现有80企业/12运营方工作量只支持约380万的假设漏斗值。若坚持476万任务，另设97企业/20运营方的开发方案，或用实际转化证据证明效率提升。新增开发量需销售负责人确认人时和渠道覆盖；未落实时不将目标转为承诺。"}, {"title": "17 后三年增长与资源规划", "body": "| 指标 | Y1 | Y2 | Y3 | Y4 |\n| 新增企业平台 | 4.0 | 6.0 | 9.0 | 12.0 |\n| 新增产业平台 | 1.0 | 1.0 | 2.0 | 2.0 |\n| 确认收入 | 410.0 | 665.4 | 1,112.5 | 1,476.1 |\n| 直接成本 | 216.4 | 313.1 | 503.2 | 632.8 |\n| 固定费用 | 124.5 | 175.0 | 240.0 | 320.0 |\n| 经营贡献 | 69.1 | 177.3 | 369.3 | 523.3 |\n| 合同支持ARR | 72.0 | 164.4 | 304.0 | 465.6 |\n| 有效工程人月 | 138.0 | 176.7 | 270.8 | 318.9 |\nY2至Y4新增企业平台分别6、9、12个，产业平台1、2、2个，验证数按企业新增的两倍规划。新签支持假设各年M7开始；首年合同沿用真实模型月份。已签首个服务年按100%履约，仅在到期续约时施加90%保留率。新增数量和M7均为规划假设；该表不是已签客户清单。\n单位直接成本假设每年通过复用改善5%，未假设员工降薪。增长仍要消耗工程资源，Y4约319个有效人月，对应平均35.4名名义交付FTE，不能沿用Y1组织预算。\nY4收入约1476万美元，以7.2预算汇率约1.06亿元人民币，已接近用户材料中的公司整体收入量级。因此四年路径必须建立独立交付和渠道网络，而非持续从总部抽调两三人。\n长期收入中经常性支持占比仍有限，不能称为纯SaaS模式或套SaaS估值。只要新增项目依赖定制实施，业务仍具有项目型收入和回款波动。\nv2.1取消了Y2至Y4“签约乘90%”的现金预测，因为签约额不等于可开票额，未开票支持费不能当作应收账款。后续年度保留损益和资源规划，现金显示未月化；批准年度资金前需补合同开票、收款和支出排期。首年现金仍使用逐合同月度模型。"}, {"title": "18 合同与交付制度", "body": "报价前由销售、架构、交付和财务共同确认：谁付款、谁验收、哪个主体签约、实际卖什么权利、允许访问哪些数据、谁承担持续运维、直接成本和峰值资源分别多少。任何一项不能从关系或合作备忘录中自动推定。\n合同至少列明：工作范围与排除项、验收用例和负责人、付款节点及发票条件、变更流程、软件与数据权利、容量与SLA、责任限额、终止交接和争议解决。需求增加必须有变更单及重新排程，不能挤占其他已签客户资源。\n伙伴采用按账户或项目的有限保护期，不因高层关系给予永久全国排他。佣金对象与服务内容需真实、合法、可审计；不可向公职人员支付成功费。资源、资料和客户沟通归档到公司系统，避免依赖个人微信和口头承诺。\n技术上线前检查身份、授权、签发与撤销、审计导出、备份恢复、接口错误处理及运行监控。链上哈希不能自动证明原始交易真实，也不自动消除数据保护义务。\n对金融、RWA或支付功能，按实际发行、托管、营销、资金控制及结算活动识别许可责任。软件商身份不能自动豁免。具体注册、税务、数据与采购资格按项目请当地顾问确认，不把一个国家的批准用于另一个国家。\n客户成功在上线后30日移交运行报告、60日量化价值、到期前90日推进续费。生产系统是否被真实使用、是否收到现金、是否达到毛利，优先于新闻稿、节点数量与会议次数。"}, {"title": "19 执行表单与待校准参数", "body": "| 表单 | 必填字段 | 责任人 |\n| 机会卡 | 客户法人、预算、决策人、金额净额、阶段、下一动作、证据链接 | 销售及国家经理 |\n| 报价卡 | 接口数、工程人月、外部采购、佣金、服务容量、毛利底线 | 架构与财务 |\n| 资源卡 | 月份、项目、角色、有效工时、可用人员、外包合同 | 交付负责人 |\n| 资金卡 | 开票、到期、回款、项目支出、税费占用、保函、累计资金 | 财务 |\n| 验收卡 | 测试用例、数据权限、客户签字、上线日期、服务开始 | 客户及交付 |\n| 经营复盘 | 签约、收入、现金、毛利、续费、丢单、逾期与容量 | 国家经理 |\n优先校准顺序：第一，产品是否能在预设工时内交付，尤其42人月产业平台是否低估；第二，企业客户能否接受55万实施和12万支持；第三，真实采购周期与30天付款假设；第四，布比可投入工程资源和现金；第五，实际有效账户池规模与转化率。\n数据获得前的处理：保留参数范围，不把未知填零；没有CRM就不编造在手管道；没有审计报表就不称公司现有收入为确定值；没有本地采购样本就不称转化率为行业平均。\n每季度更新模型一次，重大合同延期或降价即刻更新。电子表格只保存一套活动预测，情景选择1/2/3驱动同一组合同及现金计算。报告中的跨情景表为2026年10月20日测算快照，修改工作簿后应重新出报告。"}, {"title": "20 来源登记", "body": "检索与资料复核日期：2026年10月19日至20日。R为公开来源，L为用户材料，H为模型假设。\n\n## R01 UAE区块链市场\n时点：2025。2030=11039.5；CAGR68.3%。商业研究摘要，非官方统计，完整方法不可见。仅作宏观校验。；2026-10-20复盘：直链重定向主页，搜索缓存仍有原值，仅作历史摘要参考。\nhttps://www.marketsandmarkets.com/Market-Reports/geography/blockchain-technology-market/UAE\n\n## R02 沙特区块链市场\n时点：2025。2034=38064.9；CAGR64.81%。IMARC商业研究摘要；平台与服务口径，非客户可采购预算。\nhttps://www.imarcgroup.com/saudi-arabia-blockchain-market\n\n## R03 沙特区块链市场冲突源\n时点：2025。P&S公开摘要较R02高约29倍；缺少可复核口径桥接，不作预算基数，也不平均。\nhttps://www.psmarketresearch.com/market-analysis/saudi-arabia-blockchain-technology-market-report\n\n## R04 中东非洲区块链市场\n时点：2024。Ken Research：2030=53010，5 if(view==='overview'){out=intro('THE MIDDLE EAST PLAYBOOK','把战略，落到每一个经营动作。','从市场机会到订单、交付与现金，用一套可追溯的经营逻辑，规划布比在阿联酋与沙特的下一步。')+`<section class="hero"><div><div class="eyebrow">YEAR ONE · 资源到位目标</div><h2>企业平台做核心，<br>产业连接争取增量。</h2><p>目标取决于客户验证、交付资源与资金支持。<br>这是一份条件经营方案，而非已有订单预测。</p><button class="btn green" onclick="go('model')">探索三种经营情景 →</button></div><div><div class="big">476<small>万美元净签约</small></div><div class="hero-split"><div><b>332</b><span>企业核心业务</span></div><div><b>144</b><span>产业附条件增量</span></div></div><p class="muted">8 个验证 + 4 个企业生产 + 1 个产业平台</p></div></section><div class="grid">${metric('首年确认收入',410,'按验收与支持服务期间确认')}${metric('税前区域经营贡献',69.0787,'未含税费、融资及总部公共费用')}${metric('基础周转额度',108.245,'峰值缺口 + 3 个月固定费用储备')}${metric('实施峰值 FTE',36,'名义实施资源，并非全年新增员工')}</div><div class="two"><section class="card"><div class="row"><h2>先理解这三个判断</h2><span class="badge">决策导读</span></div>${chapterLink(2,'为什么从 180 万调整到 476 万？','原目标反映小团队试水规模，不代表市场容量。')}${chapterLink(8,'476 万需要怎样的销售漏斗？','目标高于假设漏斗值，需反推客户覆盖与转化条件。')}${chapterLink(12,'为什么 120 万不是全部资金答案？','税费、保证金与延迟回款，要单独压力测试。')}</section><section class="card"><div class="eyebrow">READING PATH</div><h2 style="margin-top:12px">按你的角色开始</h2>${chapterLink(0,'管理层 · 看目标与约束','先判断业务规模，再匹配投入。')}${chapterLink(17,'销售负责人 · 看市场推进','客户计划、里程碑与切换条件。')}${chapterLink(14,'交付负责人 · 看资源安排','逐合同核算工时与并发能力。')}<button class="entry" onclick="go('tasks')"><strong>经营团队 · 打开执行清单 →</strong><span class="muted">把计划转为可追踪的本地待办。</span></button></section></div>`;}
if(view==='model'){out=intro('SCENARIO EXPLORER','让目标与资源一起变化。','切换既有模型情景，比较签约、收入、现金与交付要求。这里展示 v2.1 已计算结果，不把规划假设包装成实际业绩。')+`<div class="tabs">${DATA.model.cases.map((x,i)=>`<button class="${scenario===i?'active':''}" onclick="scenario=${i};render()">${x.name}</button>`).join('')}</div><div class="grid">${metric('净签约',s.bookings,'万美元 / Y1')}${metric('确认收入',s.revenue,'万美元 / Y1')}${metric('经营贡献',s.op,'税前区域口径 / 万美元')}${metric('基础周转额度',s.funding,'含固定费用储备 / 万美元')}</div><div class="two"><section class="card"><h2>现金什么时候最吃紧？</h2>${chart()}<p class="muted">启动月份 M1–M12；不绑定公历。累计现金未含融资注入。</p></section><section class="card"><h2>收入背后的资源账</h2><table><tbody>${[['有效工程人月',s.em],['实施峰值 FTE',s.peak_engineers],['固定经营费用',s.fixed],['年内最大累计缺口',s.peak_need],['期末已生效 ARR',s.active_arr],['已签约 ARR',s.contracted_arr]].map(([t,v])=>`<tr><td>${t}</td><td><b>${fmt(v)}</b></td></tr>`).join('')}</tbody></table><p class="muted">FTE 仅为实施资源；支持服务人员未单独量化。突破情景不一定带来更高当年利润。</p><button class="link" onclick="go('manual',9)">阅读情景条件与口径 →</button></section></div><section class="card" style="margin-top:22px"><div class="row"><h2>如果执行不如预期？</h2><span class="badge">针对资源到位目标的压力测试</span></div><select id="stress" aria-label="选择压力测试" onchange="stressChoice=this.value;showStress()">${Object.keys(DATA.model.stress).map(k=>`<option ${k===stressChoice?'selected':''}>${esc(k)}</option>`).join('')}</select><div id="stressResult"></div><p class="muted">压力测试固定以资源到位目标为起点，不随上方情景选择变化；基础周转不含未定税费、保证金等额外占用。</p></section><details class="card" style="margin-top:22px"><summary>展开逐月数据 · 便于复核</summary><div class="tablewrap"><table><tr><th>月份</th><th>签约</th><th>收入</th><th>回款</th><th>支出</th><th>累计现金</th></tr>${DATA.model.cases[scenario].months.slice(0,12).map(m=>`<tr><td>M${m.month}</td>${['bookings','revenue','cash','out','cum'].map(k=>`<td>${fmt(m[k])}</td>`).join('')}</tr>`).join('')}</table></div></details>`;}
if(view==='manual'){out=intro('THE COMPLETE HANDBOOK','完整手册，随时查阅。','全部 23 个章节单元原文保留。用目录按主题阅读，或用顶部搜索找到关键判断。')+`<select class="mobile-toc" aria-label="选择手册章节" onchange="go('manual',Number(this.value))">${DATA.chapters.map((c,i)=>`<option value="${i}" ${i===chapter?'selected':''}>${i+1}. ${esc(c.title)}</option>`).join('')}</select><div class="reader"><div class="toc">${DATA.chapters.map((c,i)=>`<button onclick="go('manual',${i})" class="${i===chapter?'active':''}">${esc(c.title)}</button>`).join('')}</div><div><div class="reader-card"><div class="row"><span class="badge">${chapter+1} / ${DATA.chapters.length}</span><button class="link" onclick="window.print()">打印本章</button></div><article><h1>${esc(DATA.chapters[chapter].title)}</h1>${bodyHTML(DATA.chapters[chapter].body)}</article></div><div class="read-controls"><button class="btn" ${chapter===0?'disabled':''} onclick="go('manual',${chapter-1})">← 上一章</button><button class="btn" ${chapter===DATA.chapters.length-1?'disabled':''} onclick="go('manual',${chapter+1})">下一章 →</button></div></div></div>`;}
if(view==='tasks'){let total=tasks.reduce((a,g)=>a+g.length-1,0),done=Object.values(checked).filter(Boolean).length;out=intro('EXECUTION BOARD','从经营计划，到下一步行动。','按阶段推进关键事项。勾选只保存在当前浏览器，用于个人跟踪，不代表已有订单或经审核的项目状态。')+`<section class="card"><div class="row"><h2>我的执行进度</h2><b id="count">${done} / ${total}</b></div><progress id="progress" max="${total}" value="${done}"></progress><div class="row" style="margin-top:16px"><span class="muted">本设备保存 · 可导出留档</span><div><button class="btn" onclick="exportTasks()">导出清单</button> <button class="link" onclick="resetTasks()">重置</button></div></div></section><div class="two">${tasks.map((g,gi)=>`<section class="card"><span class="eyebrow">PHASE 0${gi+1}</span><h2 style="margin-top:10px">${g[0]}</h2>${g.slice(1).map((t,ti)=>{let id=gi+'-'+ti;return `<label class="check ${checked[id]?'done':''}"><input type="checkbox" ${checked[id]?'checked':''} onchange="toggleTask('${id}',this)"><span>${t}</span></label>`}).join('')}</section>`).join('')}</div><div class="notice">资金分批计划为 50 + 50 + 20 万美元，属于规划建议。最迟 M5 末需到位全部 120 万；实际资金决策还要考虑税费、保证金及回款延迟。</div>`;}
if(view==='sources'){out=intro('EVIDENCE & ORIGINALS','每一个判断，都能回到原处。','公开来源、用户材料与经营假设分开展示。来源说明保留 v2.1 的复盘边界，不代表本页面重新核验了外部资料。')+`<section class="card"><h2>原始交付文件</h2><div class="download"><a class="btn" href="files/manual.pdf" target="_blank">阅读手册 PDF ↗</a><a class="btn" href="files/manual.docx" download>下载 Word</a><a class="btn" href="files/model.xlsx" download>下载 Excel 测算模型</a><a class="btn" href="files/presentation.pdf" target="_blank">演示 PDF ↗</a><a class="btn" href="files/presentation.pptx" download>下载 PPT</a><a class="btn" href="files/complete-v2.1.zip" download>下载全部资料（含证据与模型）</a><a class="btn" href="files/asset-manifest.json" target="_blank">文件校验清单</a></div></section><div class="notice">R = 公开来源；L = 用户材料（未经审计）；H = 经营假设。宏观市场只用于规模校验，不直接决定合同数量。</div>${DATA.sources.map(r=>`<section class="source"><div class="row"><h3>${esc(r[1])}</h3><span class="badge">${esc(r[0])}</span></div><div class="muted">${esc(r[2])} · ${esc(r[3])} · ${esc(r[4])}</div><p>${esc(r[5])}</p>${/^https?:/.test(r[6])?`<a href="${esc(r[6])}" target="_blank" rel="noopener noreferrer">查看来源 ↗</a>`:`<span class="muted">${esc(r[6])}</span>`}</section>`).join('')}`;}

if(view==='execution'){out=intro('FIELD EXECUTION · 2026.10.21','把客户开发变成有证据的推进。','基于 v2.1 的执行补充：用于组织工作和记录证据。以下阶段条件与例会方式为建议，不是已确认的客户、订单或新增业绩预测。')+`<div class="notice">原 23 个章节及 PDF、Word、Excel 保持 v2.1。此页是网页新增行动指南；预算与合同目标仍以原模型及其条件为准。</div><div class="guide-grid"><details open><summary>01 · 两国分工：先确认谁买、谁交付</summary><p>阿联酋与沙特分别维护账户清单，按客户法人和预算主体去重；企业项目与产业运营方分开跟进。</p><ul><li>国家经理：确认产品授权、报价权限、签约主体及总部交付边界。</li><li>销售：记录客户场景、预算来源、决策链、采购程序及下一次沟通。</li><li>架构与交付：确认接口、数据权限、验证范围、验收标准及资源排期。</li><li>财务与法务：逐项确认税费、付款、保函及本地合规要求；未确认项不能当作零成本。</li></ul><button class="btn" onclick="go('manual',16)">查看两国业务分工</button></details><details open><summary>02 · 客户开发：每次会谈留下推进证据</summary><ul><li>会前：选定一个可验证的业务问题，确认业务负责人参与。</li><li>访谈：询问现有流程、问题成本、系统接口、预算路径及采购时间。</li><li>会后：给出问题摘要、待确认事项、双方负责人和约定日期。</li><li>没有预算路径、业务负责人或下一步日期时，保留为线索，不自动升级为有效商机。</li></ul><button class="btn" onclick="downloadOpportunity()">下载空白客户机会卡</button></details><details><summary>03 · 阶段推进：用交付物替代主观概率</summary><div class="tablewrap"><table><tr><th>阶段</th><th>进入下一阶段前的证据</th></tr><tr><td>目标账户 → 合格需求</td><td>客户确认的业务问题、业务负责人和预算路径。</td></tr><tr><td>合格需求 → 验证方案</td><td>验证范围、数据权限、量化验收标准和客户评审日期。</td></tr><tr><td>验证方案 → 正式报价</td><td>工程人月、外部采购、佣金、支持责任及毛利底线复核。</td></tr><tr><td>报价 → 签约</td><td>采购审批、合同文本、签约权限和付款条件已确认。</td></tr><tr><td>签约 → 交付验收</td><td>资源排期、测试记录、验收签字、开票和回款计划。</td></tr></table></div><p class="muted">“已签约”只记录已生效合同；签约、收入确认和实际回款分别统计。</p></details><details><summary>04 · 里程碑：同时检查订单、现金和人力</summary><ul><li>D1–D30：完成授权与分工，建立两国账户清单和资源表；M1 首批 50 万美元为原方案资金计划。</li><li>D31–D90：校准客户资格与预算证据，形成报价与运营方会议记录；第二批 50 万最迟 M3 末为原计划。</li><li>D91–D180：复核合同进度和产业项目证据；第三批 20 万最迟 M5 末。任何放款条件不满足，先重排未承诺支出。</li><li>M7–M12：逐合同检查验收、开票、回款和支持服务起始时间；用实际漏斗复盘下一年度。</li></ul><p>原方案基础周转需求约 108.2 万美元；120 万是阶段拨款安排，不是覆盖全部税费、保函及延迟回款的充分保证。</p><button class="btn" onclick="go('tasks')">打开可勾选执行清单</button></details><details><summary>05 · 周度复盘：只讨论变化和下一动作</summary><ul><li>销售：本周新增客户证据、阶段变化、下一动作、负责人和日期。</li><li>交付：项目并发、有效工程人月、验收阻塞及总部资源缺口。</li><li>财务：未来 13 周回款与支出、逾期应收、税费与保证金占用。</li><li>决策：哪些项目继续、补证或退出；哪些支出需要延后；谁在何时关闭问题。</li></ul><p class="muted">无真实历史转化数据时，不把模型转化率当作已验证的销售成功率。</p></details><details><summary>06 · 使用边界：让网页与业务记录保持一致</summary><ul><li>网页模型为 v2.1 结果快照；修改 Excel 后需重新核验并更新网页。</li><li>执行勾选仅保存在当前浏览器。换设备、换网址或清理浏览器数据后不会自动同步。</li><li>不要把客户敏感信息提交到这个公开网站；空白机会卡下载后在获准的内部系统填写与保存。</li><li>PDF、Word 和演示文件保留原版，本页新增建议并未写入这些附件。</li></ul></details></div>`;}
$('#app').innerHTML=out;if(view==='model')showStress();}
function bodyHTML(text){let lines=text.split('\n'),out='',rows=[];function flush(){if(rows.length){out+='<div class="tablewrap"><table>'+rows.map((r,i)=>'<tr>'+r.map(c=>`<${i?'td':'th'}>${esc(c)}</${i?'td':'th'}>`).join('')+'</tr>').join('')+'</table></div>';rows=[]}}for(let l of lines){if(/^\|[\s:|\-]+\|$/.test(l))continue;if(l.startsWith('|'))rows.push(l.split('|').slice(1,-1).map(x=>x.trim()));else{flush();if(l.startsWith('## '))out+='<h2>'+esc(l.slice(3))+'</h2>';else if(l.trim())out+='<p>'+esc(l).replace(/\[(R\d+|L\d+|H\d*)\]/g,(_,id)=>`<button class="link" onclick="source('${id}')">[${id}]</button>`)+'</p>';}}flush();return out;}
function source(id){let r=DATA.sources.find(r=>r[0]===id);$('#sourceBody').innerHTML=r?`<h3>${esc(r[1])}</h3><p>${esc(r[5])}</p>${/^https?:/.test(r[6])?`<a target="_blank" rel="noopener" href="${esc(r[6])}">打开原始来源 ↗</a>`:esc(r[6])}`:'<p>经营假设：尚需实际客户、报价与资源情况校准。</p>';$('#sourceDialog').showModal()}
function showStress(){let s=DATA.model.stress[$('#stress').value];$('#stressResult').innerHTML=`<div class="grid">${metric('确认收入',s.revenue,'万美元')}${metric('经营贡献',s.op,'万美元')}${metric('基础周转额度',s.funding,'万美元')}${metric('相对基准增加额度',s.funding-DATA.model.stress['基准'].funding,'万美元')}</div>`}
function toggleTask(id,el){checked[id]=el.checked;try{localStorage.setItem('bubi-v21-checks',JSON.stringify(checked))}catch(e){alert('浏览器未允许保存，本次勾选仅在当前页面有效。')}el.closest('label').classList.toggle('done',el.checked);let n=Object.values(checked).filter(Boolean).length;$('#count').textContent=n+' / 16';$('#progress').value=n;}
function resetTasks(){if(confirm('清除本浏览器中的执行清单勾选？')){checked={};try{localStorage.removeItem('bubi-v21-checks')}catch(e){}render()}}

function downloadOpportunity(){let text='布比中东客户机会卡｜空白工作模板（执行建议）\n\n国家 / 客户法人 / 预算主体：\n业务场景与客户确认的问题：\n业务负责人 / 决策人 / 采购联系人：\n预算来源 / 状态 / 金额净额 / 币种：\n当前阶段 / 对应证据及日期：\n验证范围 / 数据授权 / 接口：\n验收标准与客户确认人：\n工程人月 / 外部采购 / 佣金 / 支持成本：\n报价 / 毛利底线复核人：\n签约主体 / 税费 / 保函 / 付款条件待确认项：\n预计签约 / 验收 / 开票 / 回款日期（分别记录）：\n下一动作 / 双方负责人 / 约定日期：\n退出或暂停条件：\n\n在获准的内部系统填写保存；不要将客户敏感信息上传至公开网站。';let a=document.createElement('a');let u=URL.createObjectURL(new Blob([text],{type:'text/plain;charset=utf-8'}));a.href=u;a.download='布比中东_空白客户机会卡.txt';a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)}
function exportTasks(){let text='布比中东 v2.1 · 个人执行清单\n本设备记录，不代表经审核的项目状态。\n\n'+tasks.map((g,gi)=>g[0]+'\n'+g.slice(1).map((t,ti)=>(checked[gi+'-'+ti]?'[已勾选] ':'[待办] ')+t).join('\n')).join('\n\n');let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([text],{type:'text/plain;charset=utf-8'}));a.download='布比中东_我的执行清单.txt';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
$('#menu').onclick=()=>$('#sidebar').classList.contains('open')?closeNav():openNav();$('#navClose').onclick=closeNav;$('#navBackdrop').onclick=closeNav;$('#search').oninput=e=>{let q=e.target.value.trim();if(!q){render();return}let results=DATA.chapters.map((c,i)=>({...c,i})).filter(c=>(c.title+c.body).toLowerCase().includes(q.toLowerCase()));$('#app').innerHTML=intro('SEARCH THE HANDBOOK','搜索手册',`找到 ${results.length} 个相关章节 · 点击进入完整上下文`)+results.map(c=>{let pos=c.body.toLowerCase().indexOf(q.toLowerCase()),snippet=c.body.slice(Math.max(0,pos-60),Math.max(0,pos-60)+220);return `<button class="search-result" onclick="go('manual',${c.i})"><h3>${esc(c.title)}</h3><div class="muted">${esc(snippet)}…</div></button>`}).join('')+(!results.length?'<p>没有找到相关章节。试试“预算”“人月”或“现金”。</p>':'')};let hash=location.hash.slice(1).split('-');if(navs.some(n=>n[0]===hash[0])){view=hash[0];chapter=Math.min(DATA.chapters.length-1,Math.max(0,Number(hash[1])||0))}render();
</script></body></html>
